version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - api-blue
      - api-green
      - frontend
    restart: unless-stopped

  api-blue:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/maize-api:${API_TAG:-latest}
    environment:
      - MODEL_PATH=/app/model_artifacts/mobilenetv2_best.tflite
      - MODEL_META_PATH=/app/model_artifacts/mobilenetv2_meta.json
      - ALLOWED_ORIGINS=["http://localhost","https://${DOMAIN:-localhost}"]
      - LOG_LEVEL=INFO
    volumes:
      - ../model_artifacts:/app/model_artifacts:ro
    expose:
      - "8000"
    restart: unless-stopped

  api-green:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/maize-api:${API_TAG:-latest}
    environment:
      - MODEL_PATH=/app/model_artifacts/mobilenetv2_best.tflite
      - MODEL_META_PATH=/app/model_artifacts/mobilenetv2_meta.json
      - ALLOWED_ORIGINS=["http://localhost","https://${DOMAIN:-localhost}"]
      - LOG_LEVEL=INFO
    volumes:
      - ../model_artifacts:/app/model_artifacts:ro
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/maize-frontend:${FRONTEND_TAG:-latest}
    volumes:
      - frontend_dist:/usr/share/nginx/html
    entrypoint: sh -c "cp -r /usr/share/nginx/html/. /dist/ && echo 'Frontend assets ready'"
    restart: "no"

volumes:
  frontend_dist:
