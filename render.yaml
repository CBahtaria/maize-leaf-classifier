services:
  - type: web
    name: maizescan-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt && pip install -e . --no-deps
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: model_artifacts/inceptionv3_best.tflite
      - key: MODEL_META_PATH
        value: model_artifacts/inceptionv3_meta.json
      - key: MODEL_DOWNLOAD_URL
        sync: false        # set this manually in Render dashboard → Environment
      - key: ALLOWED_ORIGINS
        sync: false        # set to your Vercel URL, e.g. https://maizescan.vercel.app
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
