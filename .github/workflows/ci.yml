name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # requirements-api.txt: lightweight production deps (no TF — ai-edge-litert only)
        # requirements-dev.txt: pytest, ruff, mypy, httpx
        # -e . --no-deps: makes model.* and api.* importable without reinstalling deps
        run: |
          pip install -r requirements-api.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Ruff lint (source only — notebooks excluded)
        run: ruff check api/ model/ tests/

      - name: Mypy type check
        run: mypy api/ model/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          # TF-dependent unit tests are skipped via pytest.importorskip when TF absent.
          # Integration tests mock the model — no model file needed.
          MODEL_PATH: model_artifacts/inceptionv3_best.tflite
          MODEL_META_PATH: model_artifacts/inceptionv3_meta.json

  frontend-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
